services:
  payments:
    build:
      context: .
      dockerfile: Dockerfile_payments
    ports:
      - "8000:8000"
    networks:
      - kafka_kafka-network

  receipts:
    build:
      context: .
      dockerfile: Dockerfile_receipts
    ports:
      - "8001:8000"
    networks:
      - kafka_kafka-network

networks:
  kafka_kafka-network:
    external: true